[workspace]
resolver = "2"
members = [
  "crates/se_app",
  "crates/se_engine",
  "crates/se_assets",
]

[workspace.package]
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
